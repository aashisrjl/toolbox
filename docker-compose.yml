version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://toolshub:toolshub_secret@postgres:5432/toolshub
      - REDIS_URL=redis://redis:6379/0
      - USE_CELERY=true
      - STORAGE_DIR=/app/storage/temp
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      - ./backend/app:/app/backend/app
      - media_storage:/app/storage/temp
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A backend.app.workers.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://toolshub:toolshub_secret@postgres:5432/toolshub
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_DIR=/app/storage/temp
    volumes:
      - ./backend/app:/app/backend/app
      - media_storage:/app/storage/temp
    depends_on:
      - postgres
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: toolshub
      POSTGRES_PASSWORD: toolshub_secret
      POSTGRES_DB: toolshub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  media_storage:
  postgres_data:
