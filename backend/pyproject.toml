[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toolshub-backend"
version = "1.0.0"
description = "FastAPI backend for Toolbox media utility platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "python-multipart>=0.0.9",
    "pillow>=10.4.0",
    "pillow-heif>=1.7.0",
    "rembg>=2.0.57",
    "onnxruntime>=1.18.0",
    "redis>=5.0.0",
    "celery>=5.4.0",
    "yt-dlp>=2024.8.6",
    "qrcode[pil]>=8.0.0",
    "pypdf>=6.0.0",
    "pdf2docx>=0.5.13",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
]
